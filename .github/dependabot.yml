# Engineering hygiene H2: weekly update PRs (the owner reviews each; pins stay `==`, ADR on any model / SDK change).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
